<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Anti-FOUC: apply dark class before React hydrates so there is no flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>Perspectiva - Gamified Survey Exchange Platform</title>
    <meta
      name="description"
      content="Join Perspectiva, the gamified survey exchange platform for students and researchers. Earn points by completing surveys, launch your research, and gain insights through collaborative community-driven research."
    />
    <meta name="author" content="Perspectiva" />

    <!-- Typography system: Fraunces (serif display) + Plus Jakarta Sans (body) + IBM Plex Mono (eyebrows/labels/readouts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      display=swap prevents FOIT.
      Plus Jakarta Sans 300-700: body text — used everywhere.
      Fraunces (ital,opsz,wght): serif display headings — optical sizing 9..144.
      IBM Plex Mono 400+500+600: eyebrows, labels, stat readouts.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <meta
      property="og:title"
      content="Perspectiva - Gamified Survey Exchange Platform"
    />
    <meta
      property="og:description"
      content="Collaborative research made simple. Exchange surveys, earn points, and gain professional insights through our gamified platform."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://perspectiva.vercel.app/og.png" />
    <meta property="og:url" content="https://perspectiva.vercel.app" />
    <meta property="og:site_name" content="Perspectiva" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@perspectiva_app" />
    <meta name="twitter:image" content="https://perspectiva.vercel.app/og.png" />
    <meta name="twitter:title" content="Perspectiva - Gamified Survey Exchange Platform" />
    <meta name="twitter:description" content="Collaborative research made simple. Exchange surveys, earn points, and gain professional insights through our gamified platform." />
    <meta name="theme-color" content="#6366f1" />
    <link rel="canonical" href="https://perspectiva.vercel.app" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
