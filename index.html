<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Anti-FOUC: apply dark class before React hydrates so there is no flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>Perspectiva - Gamified Survey Exchange Platform</title>
    <meta
      name="description"
      content="Join Perspectiva, the gamified survey exchange platform for students and researchers. Earn points by completing surveys, launch your research, and gain insights through collaborative community-driven research."
    />
    <meta name="author" content="Perspectiva" />

    <!-- Typography system: Space Grotesk (display) + Plus Jakarta Sans (body) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Critical weights loaded first (display=swap prevents FOIT).
      Plus Jakarta Sans 400+500: body text — loaded eagerly, used everywhere.
      Space Grotesk 600+700: headings — loaded eagerly, above-fold impact.
      Plus Jakarta Sans 300+600+700: extended weights for hierarchy.
      Space Grotesk 300+400+500: subheadings and lighter display use.
      JetBrains Mono 400+500: data, analytics, IDs — deferred (not render-blocking).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <meta
      property="og:title"
      content="Perspectiva - Gamified Survey Exchange Platform"
    />
    <meta
      property="og:description"
      content="Collaborative research made simple. Exchange surveys, earn points, and gain professional insights through our gamified platform."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://lovable.dev/opengraph-image-p98pqg.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@perspectiva_app" />
    <meta
      name="twitter:image"
      content="https://lovable.dev/opengraph-image-p98pqg.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
